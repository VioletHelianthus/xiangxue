[package]
name = "xiangxue"
version = "0.1.0"
edition = "2024"

[dependencies]
cssparser = "0.37"
cssparser-color = "0.5"
html5ever = "0.38"
markup5ever_rcdom = "0.38"
taffy = { git = "https://github.com/DioxusLabs/taffy", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "parse"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
slab = "0.4"
lightningcss = { version = "1.0.0-alpha.67", features = ["into_owned"] }
parcel_selectors = { version = "0.28", features = ["into_owned"] }
static-self = "0.1"
